services:
  dataset-init:
    build:
      context: .
      dockerfile: Dockerfile.dataset
    volumes:
      - ./data/dataset:/input:ro
      - dataset:/dataset
    restart: "no"

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: vinolog
      POSTGRES_DB: vinolog
      POSTGRES_PASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
    ports:
      - "${VINLOG_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20

  db-import:
    image: postgres:16-bookworm
    depends_on:
      dataset-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
    volumes:
      - ./db:/import:ro
      - ./data/dataset:/input:ro
      - dataset:/dataset:ro
    entrypoint: ["sh", "/import/import-dataset.sh"]
    restart: "no"

  retrieval-index:
    build:
      context: ./services/retrieval
    depends_on:
      dataset-init:
        condition: service_completed_successfully
      db-import:
        condition: service_completed_successfully
    command: ["python", "-m", "app.build_index"]
    environment: &retrieval-environment
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
      DATASET_ROOT: /dataset/current
      INDEX_PATH: /indexes/sift-v2.npz
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-2}
      OCR_PSM: ${OCR_PSM:-6}
      OCR_PREPROCESS: ${OCR_PREPROCESS:-true}
      OCR_RETRY: ${OCR_RETRY:-false}
      VISUAL_SHORTLIST_LIMIT: ${VISUAL_SHORTLIST_LIMIT:-50}
    volumes:
      - dataset:/dataset:ro
      - retrieval-index:/indexes
    restart: "no"

  retrieval:
    build:
      context: ./services/retrieval
    depends_on:
      db:
        condition: service_healthy
      retrieval-index:
        condition: service_completed_successfully
    environment: *retrieval-environment
    ports:
      - "8080:8000"
    volumes:
      - dataset:/dataset:ro
      - retrieval-index:/indexes:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # --- Standalone wine-label retriever ------------------------------------
  # A separate service from retrieval/retrieval-index above: own image
  # (Dockerfile.retriever), own index format and file (retriever_index.py,
  # retriever-index volume), own models volume. Nothing here is read by the
  # retrieval/retrieval-index services, and changing retriever tuning can
  # never affect them. See services/retrieval/app/retriever.py.
  retriever-model:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile.retriever
    command: ["sh", "-c", "python -m app.download_model && python -m app.download_sam"]
    environment:
      MODEL_PATH: /models/dinov2-small.onnx
      SAM_MODEL_DIR: /models/sam_vit_b_quant
    volumes:
      - retriever-models:/models
    restart: "no"

  retriever-index:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile.retriever
    depends_on:
      dataset-init:
        condition: service_completed_successfully
      db-import:
        condition: service_completed_successfully
      retriever-model:
        condition: service_completed_successfully
    command: ["python", "-m", "app.build_retriever_index"]
    environment: &retriever-environment
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
      DATASET_ROOT: /dataset/current
      RETRIEVER_INDEX_PATH: /indexes/retriever-v1.npz
      MODEL_PATH: /models/dinov2-small.onnx
      SAM_MODEL_DIR: /models/sam_vit_b_quant
      VISUAL_SHORTLIST_LIMIT: ${RETRIEVER_VISUAL_SHORTLIST_LIMIT:-24}
      EMBEDDING_SHORTLIST_LIMIT: ${RETRIEVER_EMBEDDING_SHORTLIST_LIMIT:-20}
      QUERY_SAM: ${RETRIEVER_QUERY_SAM:-false}
    volumes:
      - dataset:/dataset:ro
      - retriever-index-data:/indexes
      - retriever-models:/models:ro
    restart: "no"

  retriever:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile.retriever
    depends_on:
      db:
        condition: service_healthy
      retriever-index:
        condition: service_completed_successfully
    environment: *retriever-environment
    ports:
      - "8081:8000"
    volumes:
      - dataset:/dataset:ro
      - retriever-index-data:/indexes:ro
      - retriever-models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  web:
    build: .
    depends_on:
      dataset-init:
        condition: service_completed_successfully
      db-import:
        condition: service_completed_successfully
      retrieval:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      VINLOG_UID: ${VINLOG_UID:-1000}
      VINLOG_GID: ${VINLOG_GID:-1000}
      NUXT_PUBLIC_SCAN_MODE: retrieval
      NUXT_PUBLIC_ASTRO_ENABLED: ${NUXT_PUBLIC_ASTRO_ENABLED:-true}
      NUXT_PUBLIC_SOMMELIER_MODE: ${NUXT_PUBLIC_SOMMELIER_MODE:-mock}
      NUXT_RETRIEVAL_BASE_URL: http://retrieval:8000
      NUXT_SOMMELIER_PROVIDER: ${NUXT_SOMMELIER_PROVIDER:-openai}
      NUXT_SOMMELIER_MODEL: ${NUXT_SOMMELIER_MODEL:-}
      NUXT_SOMMELIER_MAX_REQUESTS: ${NUXT_SOMMELIER_MAX_REQUESTS:-20}
      NUXT_SOMMELIER_API_KEY: ${NUXT_SOMMELIER_API_KEY:-}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
    volumes:
      - .:/workspace/Vinolog
      - ${HOME}/.ssh:/workspace/Vinolog/.docker-home/.ssh:ro
      - ${GITHUB_GEM_TOKEN_PATH:-./github_gem_token.txt}:/run/secrets/github_ssh_key:ro
      - node-modules:/workspace/Vinolog/node_modules
      - nuxt-cache:/workspace/Vinolog/apps/web/.nuxt
      - codex-home:/home/node/.codex
      - dataset:/workspace/Vinolog/data/installed:ro
    init: true
    tty: true
    stdin_open: true

volumes:
  postgres-data:
  node-modules:
  nuxt-cache:
  codex-home:
  dataset:
  retrieval-index:
  retriever-index-data:
  retriever-models:
