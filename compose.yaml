x-storage-environment: &storage-environment
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${VINLOG_S3_ACCESS_KEY:-vinolog}
  S3_SECRET_KEY: ${VINLOG_S3_SECRET_KEY:-vinolog-secret}
  S3_REGION: us-east-1

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: vinolog
      POSTGRES_DB: vinolog
      POSTGRES_PASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
    ports:
      - "${VINLOG_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${VINLOG_S3_ACCESS_KEY:-vinolog}
      MINIO_ROOT_PASSWORD: ${VINLOG_S3_SECRET_KEY:-vinolog-secret}
    ports:
      - "127.0.0.1:${VINLOG_S3_PORT:-9000}:9000"
      - "127.0.0.1:${VINLOG_S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  importer:
    build:
      context: ./services/importer
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *storage-environment
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
    volumes:
      - ./data/dataset:/input:ro
      - ./db:/db:ro
    restart: "no"

  retrieval-index:
    build:
      context: ./services/retrieval
    depends_on:
      importer:
        condition: service_completed_successfully
    command: ["python", "-m", "app.build_index"]
    environment: &retrieval-environment
      <<: *storage-environment
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-2}
      OCR_PSM: ${OCR_PSM:-6}
      OCR_PREPROCESS: ${OCR_PREPROCESS:-true}
      OCR_RETRY: ${OCR_RETRY:-false}
      VISUAL_SHORTLIST_LIMIT: ${VISUAL_SHORTLIST_LIMIT:-50}
    restart: "no"

  retrieval:
    build:
      context: ./services/retrieval
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      retrieval-index:
        condition: service_completed_successfully
    environment: *retrieval-environment
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # --- Standalone wine-label retriever ------------------------------------
  # A separate service from retrieval/retrieval-index above: own image
  # (Dockerfile.retriever), own index kind (retriever_index.py, stored in
  # MinIO), DINOv2 embeddings in pgvector, own models volume. Changing
  # retriever tuning never affects the retrieval/retrieval-index services.
  # See services/retrieval/app/retriever.py.
  retriever-model:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile.retriever
    command: ["sh", "-c", "python -m app.download_model && python -m app.download_sam"]
    environment:
      MODEL_PATH: /models/dinov2-small.onnx
      SAM_MODEL_DIR: /models/sam_vit_b_quant
    volumes:
      - retriever-models:/models
    restart: "no"

  retriever-index:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile.retriever
    depends_on:
      importer:
        condition: service_completed_successfully
      retriever-model:
        condition: service_completed_successfully
    command: ["python", "-m", "app.build_retriever_index"]
    environment: &retriever-environment
      <<: *storage-environment
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
      MODEL_PATH: /models/dinov2-small.onnx
      SAM_MODEL_DIR: /models/sam_vit_b_quant
      VISUAL_SHORTLIST_LIMIT: ${RETRIEVER_VISUAL_SHORTLIST_LIMIT:-24}
      EMBEDDING_SHORTLIST_LIMIT: ${RETRIEVER_EMBEDDING_SHORTLIST_LIMIT:-20}
      QUERY_SAM: ${RETRIEVER_QUERY_SAM:-false}
    volumes:
      - retriever-models:/models:ro
    restart: "no"

  retriever:
    build:
      context: .
      dockerfile: services/retrieval/Dockerfile.retriever
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      retriever-index:
        condition: service_completed_successfully
    environment: *retriever-environment
    ports:
      - "8081:8000"
    volumes:
      - retriever-models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  web:
    build: .
    depends_on:
      importer:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      retrieval:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      VINLOG_UID: ${VINLOG_UID:-1000}
      VINLOG_GID: ${VINLOG_GID:-1000}
      NUXT_PUBLIC_SCAN_MODE: retrieval
      NUXT_PUBLIC_ASTRO_ENABLED: ${NUXT_PUBLIC_ASTRO_ENABLED:-true}
      NUXT_PUBLIC_SOMMELIER_MODE: ${NUXT_PUBLIC_SOMMELIER_MODE:-mock}
      NUXT_RETRIEVAL_BASE_URL: http://retrieval:8000
      NUXT_SOMMELIER_PROVIDER: ${NUXT_SOMMELIER_PROVIDER:-openai}
      NUXT_SOMMELIER_MODEL: ${NUXT_SOMMELIER_MODEL:-}
      NUXT_SOMMELIER_MAX_REQUESTS: ${NUXT_SOMMELIER_MAX_REQUESTS:-20}
      NUXT_SOMMELIER_API_KEY: ${NUXT_SOMMELIER_API_KEY:-}
      NUXT_STORAGE_ENDPOINT: http://minio:9000
      NUXT_STORAGE_ACCESS_KEY: ${VINLOG_S3_ACCESS_KEY:-vinolog}
      NUXT_STORAGE_SECRET_KEY: ${VINLOG_S3_SECRET_KEY:-vinolog-secret}
      PGHOST: db
      PGPORT: "5432"
      PGUSER: vinolog
      PGDATABASE: vinolog
      PGPASSWORD: ${VINLOG_DB_PASSWORD:-vinolog}
    volumes:
      - .:/workspace/Vinolog
      - ${HOME}/.ssh:/workspace/Vinolog/.docker-home/.ssh:ro
      - ${GITHUB_GEM_TOKEN_PATH:-./github_gem_token.txt}:/run/secrets/github_ssh_key:ro
      - node-modules:/workspace/Vinolog/node_modules
      - nuxt-cache:/workspace/Vinolog/apps/web/.nuxt
      - codex-home:/home/node/.codex
    init: true
    tty: true
    stdin_open: true

volumes:
  postgres-data:
  minio-data:
  node-modules:
  nuxt-cache:
  codex-home:
  retriever-models:
